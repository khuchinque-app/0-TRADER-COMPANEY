/* React's mount point must not add a box of its own: body itself is the
   flex/grid container, and an extra <div id="root"> would break the
   height:100% reference chain — a full-viewport layout would grow with its
   content instead (a tall chart container makes ECharts draw screens of
   overflow). display:contents keeps it from generating a box, preserving
   the direct parent-child chain from body to the layout containers. */
#root{display:contents}
</style>
